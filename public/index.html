<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DewBox — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ["Fraunces", "serif"],
            sans: ["Inter", "sans-serif"],
          },
          colors: {
            ink: "#121110",
            surface: "#1b1917",
            surface2: "#241f1c",
            ember: "#e0a458",
            emberBright: "#f0b96f",
          },
        },
      },
    };
  </script>
  <style>
    body { background-color: #121110; }
    ::selection { background: #e0a458; color: #121110; }
  </style>
</head>
<body class="bg-ink text-stone-100 min-h-screen font-sans">
  <header class="px-6 md:px-10 py-6 flex items-center justify-between max-w-7xl mx-auto">
    <h1 class="font-display text-2xl font-semibold tracking-tight text-stone-50">DewBox</h1>
    <div id="headerRight" class="flex items-center gap-4 text-sm"></div>
  </header>

  <section class="max-w-7xl mx-auto px-6 md:px-10 pt-6 pb-10 md:pt-10 md:pb-16">
    <p class="text-ember text-sm font-medium tracking-wide uppercase mb-3">Video Editing Portfolio</p>
    <h2 class="font-display text-4xl md:text-6xl font-semibold leading-[1.05] max-w-3xl text-stone-50">
      Stories, cut &amp; paced with intention.
    </h2>
  </section>

  <main class="max-w-7xl mx-auto px-6 md:px-10 pb-24">
    <div class="flex flex-wrap gap-2 mb-8" id="tagFilters"></div>

    <div id="status" class="text-stone-500 text-sm mb-6"></div>

    <div id="emptyState" class="hidden border border-dashed border-stone-800 rounded-xl py-20 px-6 text-center">
      <div class="w-12 h-12 rounded-full bg-surface2 flex items-center justify-center mx-auto mb-4">
        <svg class="w-5 h-5 text-ember" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M15 10l4.55-2.5a1 1 0 011.45.89v7.22a1 1 0 01-1.45.89L15 14M5 6h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2z" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h3 id="emptyStateTitle" class="font-display text-xl text-stone-200 mb-1">No videos yet</h3>
      <p id="emptyStateBody" class="text-stone-500 text-sm mb-5">Once videos are added, they'll show up here.</p>
      <a id="emptyStateCta" href="/upload.html" class="hidden text-sm bg-ember text-ink px-4 py-2 rounded-full font-medium hover:bg-emberBright transition-colors">Add your first video</a>
    </div>

    <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-6 gap-y-10"></div>
  </main>

  <div id="modal" class="fixed inset-0 bg-black/85 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="w-full max-w-3xl">
      <div class="aspect-video rounded-xl overflow-hidden shadow-2xl shadow-black/60">
        <iframe id="player" class="w-full h-full" src="" title="Video player" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      </div>
      <div class="mt-4 flex items-center justify-between">
        <a id="watchOnYoutube" href="#" target="_blank" rel="noopener" class="text-sm text-ember hover:text-emberBright transition-colors">▶ Watch on YouTube</a>
        <button id="closeModal" class="text-sm text-stone-400 hover:text-stone-100 transition-colors">Close ✕</button>
      </div>
    </div>
  </div>

  <script src="/gallery.js"></script>
</body>
</html>
